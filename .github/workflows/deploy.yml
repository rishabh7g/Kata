name: Deploy to GitHub Pages

# docs/engineering.md § 1 Stack: GitHub Pages, deployed by a GitHub Actions
# workflow on push to main. "Deploy" means "the Actions run that published
# dist/" — there is nothing to restart and no environment to configure.
on:
  push:
    branches: [main]
  workflow_dispatch:

# The repo's default workflow permission is read-only, so Pages needs these
# stated here.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
