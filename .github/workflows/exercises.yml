# CI gate for committed practice material (#22): every exercises/**/ folder's
# Test Suite must be intact, so a learner cloning a folder never hits broken
# material (docs/engineering.md § 6). Never a test RUN — Kata never runs the
# tests and never gates on their results:
#
#   C# folders      dotnet build, build only
#   Python folders  pytest --collect-only (#172) — imports resolve and the
#                   tests are discoverable, without running a skeleton that
#                   is red by design
#
# Both toolchains are set up here because a Category picks the language and
# either kind of folder may arrive in the same push; the script only demands
# a toolchain when material in that language is actually committed.
#
# Separate from deploy.yml on purpose: the Pages deploy ships dist/ and knows
# nothing about dotnet or Python; this job path-filters to exercises/** so
# docs-only or app-only changes never pay for the installs. With zero folders
# committed the script passes with an explicit "0 Test Suites (none committed
# yet)".
name: Exercises

on:
  push:
    branches: [main]
    paths:
      - 'exercises/**'
      - 'scripts/build-exercises.sh'
      - '.github/workflows/exercises.yml'
  pull_request:
    paths:
      - 'exercises/**'
      - 'scripts/build-exercises.sh'
      - '.github/workflows/exercises.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test Suites build and collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Host/CI fact: C# exercise folders target net10.0 (docs/engineering.md § 6).
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Python folders are checked with pytest and nothing else: the material
      # is standard-library only, offline, and needs no API key (#172).
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pytest
        run: python -m pip install --quiet pytest

      # Terse output: one line per folder + a final count in the job log; the
      # full dotnet/pytest transcript goes to .checks/exercises.log for the
      # artifact.
      - name: Check every exercise Test Suite
        run: scripts/build-exercises.sh

      - name: Upload full build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exercise-build-logs
          path: .checks/exercises.log
          if-no-files-found: ignore
